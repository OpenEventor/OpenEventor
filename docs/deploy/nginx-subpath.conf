# OpenEventor behind nginx under a subpath (e.g. http://<host>/oe/).
#
# OpenEventor is one build that serves at root OR under any reverse-proxy mount.
# The only thing nginx must do is tell it the mount path via the
# `X-Forwarded-Prefix` header. The server then injects a runtime <base href> and
# window.__BASE_PATH__ into index.html, and the SPA (assets, router, API, SSE)
# uses that prefix. No per-user build, no rebuild.
#
# Run OpenEventor (headless device) on the port nginx proxies to:
#   ./openeventor-linux-armv7 --no-browser --port 8080 &
#   (optionally DATA_DIR=/var/lib/openeventor to choose where event DBs live)
#
# This is Yaroslav's config with the /oe/ block updated. Changed lines are marked
# «# ← added». After editing: `nginx -t && systemctl reload nginx`.

server {
    listen 80 default_server;
    listen 5080 default_server;

    client_max_body_size 100M;
    underscores_in_headers on;
    root /var/www/localhost/html;
    index index.html index.htm index.php;

    server_name _;

    error_page 500 502 503 504 /50x.html;

    # WiFi API
    location /loop/ {
        proxy_pass http://127.0.0.1:5088/;
        proxy_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # OpenEventor (served under /oe/)
    location /oe/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Prefix /oe;   # ← added: tells OpenEventor its mount path
        proxy_http_version 1.1;                    # ← added: for the live monitor (SSE)
        proxy_set_header Connection "";            # ← added: keep the SSE stream open
        proxy_read_timeout 3600s;                  # ← added: SSE is long-lived
        proxy_buffering off;                        # required for SSE (already present)
    }

    # Modem API
    location /cgi-bin/ {
        proxy_pass http://192.168.8.1:5080/cgi-bin/;
        proxy_pass_header Host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
        proxy_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Modem web
    location /modem/ {
        error_page 500 502 503 504 /50x_modem/50x_modem.html;
        proxy_connect_timeout 10s;
        proxy_pass http://192.168.8.1/;
        proxy_pass_header Host;
        proxy_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # PHP
    location ~ \.php$ {
        root /var/www/localhost/html;
        fastcgi_pass unix:/run/app.sock;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # All other paths → index.html (SPA fallback, no 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
