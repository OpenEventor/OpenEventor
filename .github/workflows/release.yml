name: Release

# Cuts a cross-platform release whenever a v* tag is pushed. Because SQLite is
# used through mattn/go-sqlite3 (cgo), every target needs a real C compiler, so
# the binaries are built with native/cross toolchains rather than plain GOOS
# swapping: the Linux runner cross-compiles linux + windows, the macOS runner
# builds both darwin arches. The embedded frontend (//go:embed all:frontend/dist)
# is built once and shared as an artifact.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            apt: ''
            asset: openeventor-linux-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
            asset: openeventor-linux-arm64
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            apt: gcc-mingw-w64
            asset: openeventor-windows-amd64.exe
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            apt: ''
            asset: openeventor-darwin-arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
            apt: ''
            asset: openeventor-darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cross compiler
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Restore frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build binary
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.asset }}" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: openeventor-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum openeventor-* | tee SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openeventor-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
